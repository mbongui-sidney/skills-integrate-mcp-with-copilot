<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="auth-container">
        <h3>Student Profile</h3>
        <div id="auth-status" class="hidden"></div>
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email:</label>
            <input type="email" id="login-email" required />
          </div>
          <div class="form-group">
            <label for="login-password">Password:</label>
            <input type="password" id="login-password" required />
          </div>
          <button type="submit">Log in</button>
        </form>
        <form id="register-form" class="hidden">
          <div class="form-group">
            <label for="register-name">Name:</label>
            <input type="text" id="register-name" required />
          </div>
          <div class="form-group">
            <label for="register-student-id">Student ID:</label>
            <input type="text" id="register-student-id" required />
          </div>
          <div class="form-group">
            <label for="register-department">Department:</label>
            <input type="text" id="register-department" required />
          </div>
          <div class="form-group">
            <label for="register-email">Email:</label>
            <input type="email" id="register-email" required />
          </div>
          <div class="form-group">
            <label for="register-password">Password (8+ characters):</label>
            <input type="password" id="register-password" minlength="8" required />
          </div>
          <button type="submit">Create profile</button>
        </form>
        <button id="toggle-auth" type="button" class="secondary-button">Create a profile</button>
        <button id="logout" type="button" class="secondary-button hidden">Log out</button>
      </section>

      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign up as logged-in student</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
